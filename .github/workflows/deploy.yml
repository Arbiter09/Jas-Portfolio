name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs pages:write to publish and id-token:write for the
# deployment's OIDC verification.
permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it midway, but never run
# two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages
        # enablement turns Pages on for the repo if it is not already, so this
        # needs no manual setup in the repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload dist/
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
